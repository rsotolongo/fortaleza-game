name: CI

on:
  pull_request:
  push:
    branches-ignore: [master] # master is covered by the Deploy workflow

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: 10.0.x

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: src/Fortaleza.Web/package-lock.json

      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2

      - run: dotnet test Fortaleza.slnx --configuration Release

      - name: Build the web app
        working-directory: src/Fortaleza.Web
        run: |
          npm ci
          npm run build

      - name: Check Terraform formatting
        run: terraform fmt -check -recursive terraform
