name: CI

on:
  pull_request:
  push:
    branches-ignore: [master] # master is covered by the Deploy workflow

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: src/Fortaleza.Web/package-lock.json

      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2

      - run: dotnet test Fortaleza.slnx --configuration Release

      - name: Build the web app
        working-directory: src/Fortaleza.Web
        run: |
          npm ci
          npm run build

      - name: Check Terraform formatting
        run: terraform fmt -check -recursive terraform
