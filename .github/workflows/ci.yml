name: CI

on:
  pull_request:
  push:
    branches-ignore: [master] # master is covered by the Deploy workflow

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: src/Fortaleza.Web/package-lock.json

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1

      - run: dotnet test Fortaleza.slnx --configuration Release

      - name: Build the web app
        working-directory: src/Fortaleza.Web
        run: |
          npm ci
          npm run build

      - name: Check Terraform formatting
        run: terraform fmt -check -recursive terraform
