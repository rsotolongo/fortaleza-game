name: CI

on:
  pull_request:
  push:
    branches-ignore: [master] # master is covered by the Deploy workflow

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: 10.0.x

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: src/Fortaleza.Web/package-lock.json

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1

      - run: dotnet test Fortaleza.slnx --configuration Release

      - name: Build the web app
        working-directory: src/Fortaleza.Web
        run: |
          npm ci
          npm run build

      - name: Check Terraform formatting
        run: terraform fmt -check -recursive terraform
