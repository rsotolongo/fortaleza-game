name: Deploy

on:
  push:
    branches: [master]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'original/**'
      - 'modern/**'
      - 'games/**'
      - 'build.bat'
  workflow_dispatch:

# Never run two deployments at once, and never cancel one half-way through an apply.
concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x
      - run: dotnet test Fortaleza.slnx --configuration Release

  # Runs npm and NuGet install scripts, so this job has no Google Cloud credentials at all.
  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: src/Fortaleza.Web/package-lock.json

      - name: Build the site and the API container image
        run: |
          npm ci --prefix src/Fortaleza.Web
          npm run build --prefix src/Fortaleza.Web -- --outDir "$GITHUB_WORKSPACE/terraform/build/site" --emptyOutDir
          dotnet publish src/Fortaleza.Api -c Release -r linux-x64 -t:PublishContainer \
            -p:PublishReadyToRun=true -p:ExcludeWwwroot=true -p:ContainerFamily=noble-chiseled \
            -p:ContainerRepository=fortaleza-api -p:ContainerImageTag=build \
            -p:ContainerArchiveOutputPath="$GITHUB_WORKSPACE/terraform/build/api-image.tar.gz"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: build
          path: terraform/build
          if-no-files-found: error
          retention-days: 1

  # Only this job can impersonate the deploy service account, and it only runs pre-built artifacts, Terraform
  # and the Firebase CLI (installed without npm install scripts).
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # lets the job request an OIDC token for Workload Identity Federation
    env:
      GOOGLE_CLOUD_PROJECT: ${{ vars.GCP_PROJECT_ID }}
      GOOGLE_CLOUD_REGION: ${{ vars.GCP_REGION }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: build
          path: terraform/build

      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_wrapper: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - name: Install the Firebase CLI
        run: |
          npm install --ignore-scripts --no-save --no-audit --no-fund --prefix "$RUNNER_TEMP/firebase" firebase-tools@15.32.1
          echo "FIREBASE_CLI=$RUNNER_TEMP/firebase/node_modules/.bin/firebase" >> "$GITHUB_ENV"

      - id: auth
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}
          token_format: access_token

      - name: Log in to Artifact Registry
        env:
          ACCESS_TOKEN: ${{ steps.auth.outputs.access_token }}
        run: |
          [[ "$GOOGLE_CLOUD_REGION" =~ ^[a-z0-9-]+$ ]] || { echo "Invalid GCP_REGION"; exit 1; }
          docker login -u oauth2accesstoken --password-stdin "https://$GOOGLE_CLOUD_REGION-docker.pkg.dev" <<< "$ACCESS_TOKEN"

      # Runners are ephemeral, so the state must live in GCS. The override file keeps local
      # runs of deploy.ps1 / deploy.sh on local state without any change to the Terraform code.
      - name: Configure remote state
        working-directory: terraform
        env:
          STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
        run: |
          [[ "$STATE_BUCKET" =~ ^[a-z0-9._-]{3,222}$ ]] || { echo "Invalid TF_STATE_BUCKET"; exit 1; }
          cat > backend_override.tf <<EOF
          terraform {
            backend "gcs" {
              bucket = "$STATE_BUCKET"
              prefix = "fortaleza"
            }
          }
          EOF

      - name: Deploy
        working-directory: terraform
        run: ./deploy.sh --skip-build --auto-approve

      - name: Summary
        working-directory: terraform
        run: echo "Deployed to $(terraform output -raw site_url)" >> "$GITHUB_STEP_SUMMARY"
