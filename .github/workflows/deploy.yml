name: Deploy

on:
  push:
    branches: [master]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'original/**'
      - 'modern/**'
      - 'games/**'
      - 'build.bat'
  workflow_dispatch:

# Never run two deployments at once, and never cancel one half-way through an apply.
concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: 10.0.x
      - run: dotnet test Fortaleza.slnx --configuration Release

  # Runs npm and NuGet install scripts, so this job has no AWS credentials at all.
  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: 10.0.x

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: src/Fortaleza.Web/package-lock.json

      - name: Build the site and the Lambda package
        run: |
          npm ci --prefix src/Fortaleza.Web
          npm run build --prefix src/Fortaleza.Web -- --outDir "$GITHUB_WORKSPACE/terraform/build/site" --emptyOutDir
          dotnet publish src/Fortaleza.Api -c Release -r linux-arm64 --self-contained false \
            -p:PublishReadyToRun=true -p:ExcludeWwwroot=true -o terraform/build/publish

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: build
          path: terraform/build
          if-no-files-found: error
          retention-days: 1

  # Only this job can assume the AWS role, and it only runs pre-built artifacts and Terraform.
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # lets the job request an OIDC token to assume the AWS role
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: build
          path: terraform/build

      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_wrapper: false

      - uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4.3.1
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      # Runners are ephemeral, so the state must live in S3. The override file keeps local
      # runs of deploy.ps1 / deploy.sh on local state without any change to the Terraform code.
      - name: Configure remote state
        working-directory: terraform
        env:
          STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
          STATE_REGION: ${{ vars.AWS_REGION }}
        run: |
          [[ "$STATE_BUCKET" =~ ^[a-z0-9.-]{3,63}$ ]] || { echo "Invalid TF_STATE_BUCKET"; exit 1; }
          [[ "$STATE_REGION" =~ ^[a-z0-9-]+$ ]] || { echo "Invalid AWS_REGION"; exit 1; }
          cat > backend_override.tf <<EOF
          terraform {
            backend "s3" {
              bucket       = "$STATE_BUCKET"
              key          = "fortaleza/terraform.tfstate"
              region       = "$STATE_REGION"
              use_lockfile = true
              encrypt      = true
            }
          }
          EOF

      - name: Deploy
        working-directory: terraform
        run: ./deploy.sh --skip-build --auto-approve

      - name: Summary
        working-directory: terraform
        run: echo "Deployed to $(terraform output -raw site_url)" >> "$GITHUB_STEP_SUMMARY"
