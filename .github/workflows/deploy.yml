name: Deploy

on:
  push:
    branches: [master]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'original/**'
      - 'modern/**'
      - 'games/**'
      - 'build.bat'
  workflow_dispatch:

# Never run two deployments at once, and never cancel one half-way through an apply.
concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write # lets the job request an OIDC token to assume the AWS role

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: 10.0.x
      - run: dotnet test Fortaleza.slnx --configuration Release

  deploy:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: 10.0.x

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: src/Fortaleza.Web/package-lock.json

      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_wrapper: false

      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      # Runners are ephemeral, so the state must live in S3. The override file keeps local
      # runs of deploy.ps1 / deploy.sh on local state without any change to the Terraform code.
      - name: Configure remote state
        working-directory: terraform
        run: |
          cat > backend_override.tf <<EOF
          terraform {
            backend "s3" {
              bucket       = "${{ vars.TF_STATE_BUCKET }}"
              key          = "fortaleza/terraform.tfstate"
              region       = "${{ vars.AWS_REGION }}"
              use_lockfile = true
              encrypt      = true
            }
          }
          EOF

      - name: Build and deploy
        working-directory: terraform
        run: ./deploy.sh --auto-approve

      - name: Summary
        working-directory: terraform
        run: echo "Deployed to $(terraform output -raw site_url)" >> "$GITHUB_STEP_SUMMARY"
